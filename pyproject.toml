[project]
name = "funlesson-api"
version = "0.1.0"
description = "funlesson 核心处理库：课程视频链接 -> 转写 -> 大纲 -> 思维导图/PPT/架构图"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "funtalk",
    "yt-dlp",
    "python-pptx",
]

[[project.authors]]
name = "niuliangtao"
email = "farfarfun@qq.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]
license-files = []

[dependency-groups]
dev = [
    "pytest",
]
