[project]
name = "funlesson"
version = "0.1.11"
description = "funlesson 核心处理库：课程视频链接 -> 转写 -> 大纲 -> 思维导图/PPT/架构图"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "funtalk",
    "yt-dlp",
    "python-pptx",
]
license = "MIT"

[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funlesson"
Releases = "https://github.com/farfarfun/funlesson/releases"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest",
]
